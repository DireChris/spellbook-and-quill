name: Publish Spellbook & Quill Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install
          }

      - name: TypeScript type check
        run: npm run typecheck

      - name: Build Windows installer
        run: npm run package:win

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spellbook-and-Quill-Windows-${{ github.ref_name }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release and attach installer
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Spellbook & Quill ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*.exe
          fail_on_unmatched_files: true
